# Automated dependency updates (SCA): weekly PRs for npm packages, GitHub
# Actions and the Docker base image. Security updates open immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
