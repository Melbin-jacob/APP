# Full local stack: app + PostGIS + Redis + Mailpit (test inbox).
# Only the app (3000) and the inbox (8025) are exposed; db and redis stay
# on the internal network so a local Postgres/Redis can't clash.
#   docker compose up --build
#   App:   http://localhost:3000
#   Inbox: http://localhost:8025   (every email the app sends lands here)
services:
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      mailpit: { condition: service_started }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/homeservices?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-test-secret-change-me-0123456789abcdef
      REVIEW_TOKEN_PEPPER: local-test-pepper-change-me-0123456789abcdef
      REVIEW_TOKEN_TTL_DAYS: "14"
      CRON_SECRET: local-test-cron-secret-change-me-0123456789
      EMAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: GetTradePros <no-reply@gettradepros.test>
      SEED_DEMO_DATA: "true"
      # The secrets above are public test values: allowed only because APP_URL is localhost.
      ALLOW_INSECURE_LOCAL_SECRETS: "true"
      # Docker Desktop often can't route IPv6; without this, calls to outside
      # services (address suggestions, postal-code lookup) can hang until timeout.
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Optional: free key from geoapify.com for reliable address suggestions.
      # Put GEOAPIFY_API_KEY=... in a .env file next to this one.
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}

  db:
    image: postgis/postgis:16-3.4
    # Published for amd64 only; Apple Silicon runs it via Rosetta emulation.
    platform: linux/amd64
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homeservices
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # Check over TCP, not the Unix socket: on first start the image runs a
      # temporary socket-only server to create the database, then restarts.
      # A socket check passes too early and the app hits that restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d homeservices"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 60s

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]

volumes:
  pgdata:
